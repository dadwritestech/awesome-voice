name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pytest
      - run: python -m pytest -q score/ tests/
      - run: node --test tests/hook.test.js
      - run: python score/voicescore.py selftest
      # Dogfood the action on this repo's own docs and voices.
      - uses: ./
        with:
          files: "*.md voices/*/VOICE.md plugin/README.md plugin/skills/*/SKILL.md"
          max-grade: B
